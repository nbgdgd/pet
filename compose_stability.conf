// Типы, которые компилятор Compose должен считать СТАБИЛЬНЫМИ.
//
// Зачем. List — интерфейс, и его реализация может меняться на месте, поэтому Compose
// по умолчанию считает любой List нестабильным. В режиме strong skipping (включён по
// умолчанию с Kotlin 2.0.20) нестабильный аргумент сравнивается по ССЫЛКЕ. На главном
// экране это давало вот что: HomeViewModel на каждое изменение состояния собирает
// новый список секций (copy/map/+), из него пересчитываются строки сетки — и хотя
// содержимое строки то же самое, ссылка другая, поэтому перерисовывалась КАЖДАЯ
// видимая строка и каждая карточка в ней. Ровно на этом и терялись кадры при
// прокрутке: подгрузка любой секции роняла всё видимое.
//
// Со стабильным List аргументы сравниваются через equals — строка с тем же
// содержимым пропускает перерисовку.
//
// Чем расплачиваемся. Обещание «список не меняется на месте» теперь на нас. В этом
// проекте оно выполняется: в композицию уходят только снимки из StateFlow, которые
// ViewModel собирает заново (copy, map, plus, chunked), а изменяемые коллекции
// (pool, rawPage, loadingKeys в HomeViewModel) приватные и до composable не доходят.
// Если когда-нибудь появится MutableList, который отдают в @Composable и правят на
// месте, — экран перестанет обновляться, и искать это надо будет здесь.
kotlin.collections.Collection
kotlin.collections.List
kotlin.collections.Set
kotlin.collections.Map

// Доменные модели. Они живут в core-aggregator и core-database — модулях БЕЗ плагина
// Compose, поэтому вывести их устойчивость компилятор не может в принципе и по
// умолчанию считает нестабильными. А от них зависят все элементы списков: пока Anime
// нестабилен, нестабилен и List<Anime>, сколько ни объявляй стабильным сам List.
//
// Все перечисленные — data-класcы из неизменяемых полей (val + примитивы/строки),
// собираются заново при каждом изменении и после отдачи в композицию не правятся.
com.aniblaze.aggregator.model.*
com.aniblaze.aggregator.repository.ContinueWatchingItem
com.aniblaze.aggregator.repository.ResumePoint
com.aniblaze.database.settings.UserSettings
